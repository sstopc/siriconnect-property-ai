name: property_ai_mobile
description: SiriConnect Property AI

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1

  # ---------- Routing ----------
  go_router: ^16.0.0

  # ---------- Networking ----------
  dio: ^5.9.0

  # ---------- Logging ----------
  logger: ^2.6.1

  # ---------- Typography ----------
  google_fonts: ^6.3.1

  # ---------- SVG ----------
  flutter_svg: ^2.2.0

  # ---------- Localization ----------
  intl: ^0.20.2

  # ---------- Local Storage ----------
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/